plugins {
    id 'com.android.application' version '8.2.2'
}

android {
    namespace 'com.focuslock.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.focuslock.app"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
