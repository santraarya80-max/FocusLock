
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.focuslock.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.focuslock.app'
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName '3.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
}
